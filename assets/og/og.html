<!DOCTYPE html><html><head><meta charset="utf-8"><title>Tapa Chart 공유 썸네일 원본 (1200×630)</title>
<!-- 이 파일을 브라우저로 열어 1200×630으로 캡처하면 web/og-image.png가 됩니다. -->
<style>
@font-face { font-family: 'Pretendard Variable'; src: url('../fonts/PretendardVariable.woff2') format('woff2'); font-weight: 100 900; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; overflow: hidden; font-family: 'Pretendard Variable', sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased; }

body { background: #FF733C; color: #fff; position: relative; }
.bg { position: absolute; right: -10px; bottom: 0; display: flex; align-items: flex-end; gap: 26px; }
.bg div { width: 92px; background: rgba(255,255,255,.18); }
.bg div.hl { background: #fff; }
.logo { position: absolute; right: 64px; top: 64px; width: 150px; filter: brightness(0) invert(1); }
.txt { position: absolute; left: 72px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
h1 { font-size: 120px; font-weight: 800; letter-spacing: -0.045em; line-height: .95; }
p { margin-top: 30px; font-size: 34px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.4; color: #FFF3EC; }
.tag { margin-top: 36px; display: flex; gap: 10px; }
.tag span { font-size: 22px; font-weight: 700; color: #FF733C; background: #fff; border-radius: 999px; padding: 10px 20px; }
</style></head><body>
<div class="bg"><div style="height:200px"></div><div style="height:290px"></div><div class="hl" style="height:470px"></div><div style="height:350px"></div><div style="height:240px"></div></div>
<img class="logo" src="../newstapa-logo.svg">
<div class="txt"><h1>Tapa<br>Chart</h1><p>기사를 넣으면 그래픽이 나옵니다</p><div class="tag"><span>막대</span><span>꺾은선</span><span>표</span><span>숫자 카드</span></div></div>
</body></html>
